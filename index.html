.track .tl{position:absolute;top:28px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--on-ink-mute)}
.track .now{position:absolute;top:0;width:2px;height:28px;background:var(--on-ink);transform:translateX(-50%)}
.track .now::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--on-ink)}
.pchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pchip{font:inherit;color:var(--fg);background:var(--soft);border:1.75px solid transparent;border-radius:18px;padding:12px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pchip b{font-family:var(--display);font-stretch:62%;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip span{font-family:var(--mono);font-size:10.5px;color:var(--mute);white-space:nowrap}
.pchip.now{border-color:var(--fg)}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pchip[aria-pressed="true"] span{color:var(--on-ink-mute)}
.pchip:active{opacity:.6}
.pchip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{background:var(--soft);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-height:124px;min-width:0}
.tile .tlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tile .tv{font-family:var(--display);font-stretch:66%;font-weight:850;font-size:48px;line-height:.95;margin-top:auto}
.tile .tv small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--mute);margin-left:4px;letter-spacing:0}
.tile .ts{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:active{opacity:.7}
.sunrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding:6px 6px 6px 16px;background:var(--soft);border-radius:999px;font-size:14px}
.sunrow a{text-decoration:none;background:var(--bg);border-radius:999px;padding:10px 16px;font-weight:600;font-size:13px;color:var(--fg)}
@media (max-width:370px){.ph-name{font-size:62px}.pchip b{font-size:12px}.tile .tv{font-size:40px}}
@media (prefers-reduced-motion:no-preference){.pchip,.tile,nav a{transition:background .15s,color .15s,padding .15s}}

/* ===== redesign: remaining pages ===== */
.panel .grid{margin-top:16px}
.panel .grid .h,.panel .grid .n{color:var(--on-ink-mute)}
.panel .grid .h.t,.panel .grid .n{color:var(--on-ink)}
.panel .grid .h{font-family:var(--mono)}
.panel .dot{border-color:var(--on-ink)}
.panel .dot.on{background:var(--on-ink)}
.panel .ph-name small{font-family:var(--mono);font-stretch:100%;font-weight:400;font-size:13px;text-transform:none;letter-spacing:.04em;margin-left:8px;color:var(--on-ink-mute)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.tiles3 .tile{min-height:104px;padding:14px}
.tiles3 .tile .tv{font-size:40px}
.ptab{background:var(--soft);border-radius:18px;padding:10px 12px 10px 16px;border-bottom:0;margin-top:8px;min-height:70px}
.ptab.hd{background:none;padding:0 12px 0 16px;min-height:28px;margin-top:6px}
.prow,.sk{background:var(--soft);border-radius:var(--r);border-bottom:0;padding:16px;margin-top:8px}
.sk .top,.prow .top{align-items:baseline}
.ent{background:var(--soft);border-radius:var(--r);border-bottom:0;padding:16px;margin-top:8px}
.row.lk{background:var(--soft);border-radius:var(--r);border-bottom:0;padding:8px 18px;margin-top:8px;min-height:64px}
.pgrid button{background:var(--soft)}
.prow .pbar,.sk .pbar{background:var(--bg)}
</style>

<body>

<div id="app"></div>
<nav aria-label="Main"><div id="navbar"></div></nav>

<div id="lockbox"></div>
<div id="ringbox"></div>
<script>
(function(){
"use strict";
var P=["fajr","dhuhr","asr","maghrib","isha"];
var PN={fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha"};
/* Sunnah around each fard prayer: [before rakat, after rakat] */
var SUN={fajr:[2,0],dhuhr:[4,2],asr:[4,0],maghrib:[0,2],isha:[0,2]};
var EX=[
 {k:"pushup",n:"Push-up",u:"reps",s:[1,5,10]},
 {k:"pullup",n:"Pull-up",u:"reps",s:[1,5]},
 {k:"situp",n:"Sit-up",u:"reps",s:[5,10,20]},
 {k:"squat",n:"Squat",u:"reps",s:[5,10,20]},
 {k:"plank",n:"Plank",u:"sec",s:[15,30,60]},
 {k:"run",n:"Run",u:"km",s:[0.5,1,5]}
];
var DOW=["S","M","T","W","T","F","S"];
var TABS=[["today","Today"],["progress","Progress"],["prayers","Prayers"],["tasks","Tasks"],["journal","Journal"],["workout","Workout"],["projects","Projects"],["notes","Notes"],["skills","Skills"],["events","Events"],["tools","Tools"],["settings","Settings"]];
var pad=function(n){return String(n).padStart(2,"0")};
var key=function(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

/* ---------- prayer time calculation (Karachi 18/18, Asr Shafi'i) ---------- */
var R=Math.PI/180;
var sin=function(d){return Math.sin(d*R)},cos=function(d){return Math.cos(d*R)},tan=function(d){return Math.tan(d*R)};
var asin=function(x){return Math.asin(x)/R},acos=function(x){return Math.acos(x)/R},atan2=function(y,x){return Math.atan2(y,x)/R};
var fix=function(a,m){a=a-m*Math.floor(a/m);return a<0?a+m:a};
function sunPos(jd){
 var D=jd-2451545.0;
 var g=fix(357.529+0.98560028*D,360);
 var q=fix(280.459+0.98564736*D,360);
 var L=fix(q+1.915*sin(g)+0.020*sin(2*g),360);
 var e=23.439-0.00000036*D;
 var RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24);
 var eq=fix(q/15-RA+12,24)-12;
 return {decl:asin(sin(e)*sin(L)),eq:eq};
}
function calcTimes(date,lat,lng,tz){
 var jd=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/864e5+2440587.5+0.5-lng/360;
 var sp=sunPos(jd);
 var noon=12+tz-lng/15-sp.eq;
 function t(angle){
  var term=(-sin(angle)-sin(lat)*sin(sp.decl))/(cos(lat)*cos(sp.decl));
  return acos(Math.max(-1,Math.min(1,term)))/15;
 }
 var asrAngle=-Math.atan(1/(1+tan(Math.abs(lat-sp.decl))))/R;
 return {fajr:noon-t(18),sunrise:noon-t(0.833),dhuhr:noon+0.0,asr:noon+t(asrAngle),maghrib:noon+t(0.833),isha:noon+t(18)};
}

/* ---------- state ---------- */
var SK="focus-proto-v1";
var S=null;
var NAVDEF={progress:1,projects:1,notes:1,skills:1,events:1,tools:1};
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function cap(){return (window.Capacitor&&window.Capacitor.Plugins)||{}}
function seed(){
 var today=new Date(),s={customEx:[],prayers:{},sunnah:{},tasks:[],journal:{},workout:{},settings:{lat:9.3157,lng:76.615,offsets:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},journalTime:"21:30",theme:"system",ex:"pushup",navV:2,navHidden:JSON.parse(JSON.stringify(NAVDEF))}};
 var miss={3:["isha"],6:["asr","isha"]};
 for(var i=1;i<=6;i++){
  var k=key(addDays(today,-i)),o={};
  P.forEach(function(p){if(!(miss[i]&&miss[i].indexOf(p)>-1))o[p]=1});
  s.prayers[k]=o;
  s.sunnah[k]={"fajr-b":1,"dhuhr-b":i%2?1:0,"dhuhr-a":1,"maghrib-a":1,"isha-a":i%3?1:0};
  s.workout[k]={pushup:[0,30,40,0,35,45,50][i],pullup:[0,6,8,0,7,9,10][i],situp:[0,40,50,0,40,60,50][i],squat:[0,50,60,0,50,60,70][i],run:[0,2.5,3,0,2,4,3.5][i],plank:[0,60,75,0,60,90,90][i]};
 }
 s.tasks=[
  {id:1,t:"CAT quant practice set",due:"06:30",day:"today",done:false,subs:[{id:11,t:"Arithmetic, 20 questions",done:true},{id:12,t:"Review mistakes",done:false}]},
  {id:2,t:"Review burn-in log",due:"10:00",day:"today",done:false},
  {id:3,t:"Water the plants",due:"17:30",day:"today",done:true},
  {id:4,t:"Order gate motor driver",due:"",day:"later",done:false}
 ];
 s.journal[key(addDays(today,-1))]="Long day at the line. Fixed the dispatch timeout and finally got through the DILR set. Need to sleep earlier.";
 s.journal[key(addDays(today,-2))]="Quiet day. Football in the evening, legs are sore.";
 var M=function(a){return a.map(function(n,i){return {id:i+1,name:n,photos:[]}})};
 s.projects=[
  {id:1,name:"Home gate automation",plan:"Motorise the swing gate and control it from the phone.",steps:[{id:11,t:"Pick motor and driver",done:true},{id:12,t:"Order parts",done:false},{id:13,t:"Mount and wire",done:false},{id:14,t:"Test limit switches",done:false}],points:[{id:21,t:"Check hinge load before buying the motor"},{id:22,t:"Keep a manual release"}],remind:""},
  {id:2,name:"CAT quant revision",plan:"Cover every quant topic once before the next mock.",steps:[{id:31,t:"Arithmetic",done:true},{id:32,t:"Algebra",done:true},{id:33,t:"Geometry",done:false},{id:34,t:"Number systems",done:false}],points:[],remind:""}
 ];
 s.subjects=[{id:1,name:"Quant",modules:M(["Arithmetic","Algebra","Geometry","Number systems"])},{id:2,name:"DILR",modules:M(["Arrangements","Games and tournaments","Networks"])},{id:3,name:"VARC",modules:M(["Reading comprehension","Para jumbles","Vocabulary"])},{id:4,name:"Work",modules:M(["General"])}];
 s.subjects[0].modules[0].done=true;s.subjects[0].modules[0].doneOn=key(addDays(today,-3));s.subjects[0].modules[1].done=true;s.subjects[0].modules[1].doneOn=key(addDays(today,-1));
 s.events=[{id:1,t:"Inter-department football tournament",d:key(addDays(today,-12)),r:"Quarter-finalist",n:"Played midfield."},{id:2,t:"Robotics workshop",d:key(addDays(today,-40)),r:"Participant",n:""}];
s.scratch="";s.jphotos={};
 s.alarms=[{id:1,time:"05:00",label:"Wake up",rep:"daily",on:false}];s.pomo={};
 var sk1={},sk2={},sk3={},hrs=[0,1.5,1,0,2,1,1.5];
 for(var j=1;j<=6;j++){sk1[key(addDays(today,-j))]=hrs[j];sk2[key(addDays(today,-j))]=hrs[j]?0.5:0;sk3[key(addDays(today,-j))]=hrs[7-j]}
 sk1[key(addDays(today,-30))]=35;sk2[key(addDays(today,-20))]=12;sk3[key(addDays(today,-25))]=20;
 s.skills=[{id:1,name:"Python automation",target:100,log:sk1},{id:2,name:"CAN bus",target:50,log:sk2},{id:3,name:"Quant fundamentals",target:60,log:sk3}];
 if(NATIVE){
  s.prayers={};s.sunnah={};s.workout={};s.tasks=[];s.journal={};s.projects=[];s.events=[];s.skills=[];s.alarms=[];s.pomo={};
  s.subjects=s.subjects.map(function(x){return {id:x.id,name:x.name,modules:[]}});
 }
 return s;
}
function load(){try{var r=localStorage.getItem(SK);if(r){var o=JSON.parse(r),d=seed();["projects","subjects","skills","events","alarms","pomo","jphotos"].forEach(function(k){if(!o[k])o[k]=d[k]});o.subjects.forEach(function(x){if(!x.modules){var ph=x.photos||[],ds=d.subjects.filter(function(y){return y.name===x.name})[0];x.modules=(!ph.length&&ds)?ds.modules:[{id:1,name:"General",photos:ph}];delete x.photos}});if(!o.customEx)o.customEx=[];if(!o.settings.navV){o.settings.navV=2;var nh=o.settings.navHidden||{};if(!Object.keys(nh).some(function(x){return nh[x]}))o.settings.navHidden=JSON.parse(JSON.stringify(NAVDEF))}return o}}catch(e){}return seed()}
var toastT=0;
function toast(m){var t=document.getElementById("toast");if(!t)return;t.textContent=m;t.className="on";clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},4500)}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));if(NATIVE&&window.nq)window.nq();return true}catch(e){toast("Storage is full, so your last change may not be kept. Remove some photos.");return false}}
S=load();
var addingFor=null,focusSn=false,confirmDel=null,focusId=null,viewPhoto=null,noteMsg="",lastNav=null,navSig="",tasksTab="todo",projTab="active",notesTab="subjects",annMode=null,annColor="#000000",txtPt=null,commentsOpen=false,drawing=null;

/* ---------- helpers ---------- */
function times(date){
 var c=calcTimes(date,+S.settings.lat,+S.settings.lng,5.5),o={};
 P.forEach(function(p){o[p]=Math.round(c[p]*60)+(+S.settings.offsets[p]||0)});
 o.sunrise=Math.round(c.sunrise*60);
 return o;
}
function fmtT(m){var h=Math.floor(m/60)%24,mm=m%60,ap=h<12?"am":"pm";return (h%12||12)+":"+pad(mm)+" "+ap}
function fmtH(m){var s=fmtT(m).split(" ");return s[0]+"<small>"+s[1]+"</small>"}
function nextPrayer(){
 var now=new Date(),nm=now.getHours()*60+now.getMinutes(),tm=times(now),i;
 for(i=0;i<P.length;i++){if(tm[P[i]]>nm){return {k:P[i],t:tm[P[i]],left:tm[P[i]]-nm}}}
 var tt=times(addDays(now,1));
 return {k:"fajr",t:tt.fajr,left:tt.fajr+1440-nm,tomorrow:true};
}
function leftText(m){var h=Math.floor(m/60),mm=m%60;return "in "+(h?h+" h ":"")+mm+" min"}
function dayDone(k){var p=S.prayers[k]||{};return P.every(function(x){return p[x]})}
function streak(){var d=new Date(),n=0;if(!dayDone(key(d)))d=addDays(d,-1);while(dayDone(key(d))&&n<999){n++;d=addDays(d,-1)}return n}
function sunKeys(){var a=[];P.forEach(function(p){if(SUN[p][0])a.push(p+"-b");if(SUN[p][1])a.push(p+"-a");if(p==="isha")a.push("witr")});return a}
function sunDone(k){var s=S.sunnah[k]||{};return sunKeys().filter(function(x){return s[x]}).length}
var chk=function(on,act,k,label,sm){return '<button class="chk'+(sm?" sm":"")+'" aria-pressed="'+(on?"true":"false")+'" aria-label="'+label+'" data-a="'+act+'" data-k="'+k+'"></button>'};
function workoutVal(k,ex){var w=S.workout[k]||{};return w[ex]||0}
function allEx(){return EX.concat(S.customEx||[])}
function exDef(k){return allEx().filter(function(e){return e.k===k})[0]}
function fmtVal(ex,v){var d=exDef(ex),u=d?d.u:"reps";if(u==="sec"){v=Math.round(v);return Math.floor(v/60)+":"+pad(v%60)}if(u==="km")return (Math.round(v*10)/10)+" km";return String(v)}

/* ---------- views ---------- */
function head(title,eyebrow,extra){return '<div class="top"><p class="eyebrow">'+eyebrow+'</p>'+(extra||"")+'</div><h1>'+title+'</h1>'}
function dateLong(){return new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}

function cdText(){
 var nx=nextPrayer(),n=new Date(),sec=(nx.t+(nx.tomorrow?1440:0))*60-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds());
 if(sec<0)sec=0;var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return pad(h)+":"+pad(m)+":"+pad(x);
}
function vToday(){
 var tk=key(),tm=times(new Date()),nx=nextPrayer(),pr=S.prayers[tk]||{},n=P.filter(function(x){return pr[x]}).length;
 var cur=null,nowM=new Date().getHours()*60+new Date().getMinutes();
 P.forEach(function(p){if(tm[p]<=nowM)cur=p});
 var h=head("Today",dateLong());
 h+='<section class="panel" aria-label="Next prayer"><div class="ph-top"><p class="eyebrow">Next prayer'+(nx.tomorrow?' · tomorrow':'')+'</p><p class="eyebrow">Sunrise '+fmtT(tm.sunrise)+'</p></div>';
 h+='<p class="ph-name">'+PN[nx.k]+'</p><p style="margin:0"><span class="ph-cd" id="cd">'+cdText()+'</span><span class="ph-at">at '+fmtT(nx.t)+'</span></p>';
 var t0=tm.fajr-45,t1=tm.isha+75,pos=function(m){return Math.max(0,Math.min(100,(m-t0)/(t1-t0)*100))};
 h+='<div class="track" role="img" aria-label="Prayers across the day, '+n+' of 5 prayed"><span class="past" style="width:'+pos(nowM)+'%"></span>';
 P.forEach(function(p){var x=pos(tm[p]);h+='<span class="tk'+(pr[p]?" on":"")+'" style="left:'+x+'%"></span><span class="tl" style="left:'+x+'%">'+PN[p].charAt(0)+'</span>'});
 h+='<span class="now" style="left:'+pos(nowM)+'%"></span></div></section>';
 h+='<div class="pchips" role="group" aria-label="Mark prayers">';
 P.forEach(function(p){h+='<button class="pchip'+(p===cur?" now":"")+'" data-a="p" data-k="'+p+'" aria-pressed="'+(pr[p]?"true":"false")+'" aria-label="'+PN[p]+' at '+fmtT(tm[p])+(pr[p]?', prayed':', not prayed')+'"><b>'+PN[p]+'</b><span>'+fmtT(tm[p]).replace(" ","")+'</span></button>'});
 h+='</div><div class="sunrow"><span>Sunnah <b>'+sunDone(tk)+'</b><span class="mute">/'+sunKeys().length+'</span> · Prayer streak <b>'+streakFn(dayDone)+'</b></span><a href="#prayers">Open</a></div>';
 var due=S.tasks.filter(function(t){return t.day==="today"}).sort(function(a,b){return (a.due||"99").localeCompare(b.due||"99")}),left=due.filter(function(t){return !t.done}).length;
 var jt=(S.journal[tk]||"").trim()||((S.jphotos||{})[tk]||[]).length;
 var parts=allEx().map(function(e){var v=workoutVal(tk,e.k);return v?e.n+" "+fmtVal(e.k,v):""}).filter(Boolean);
 h+='<div class="tiles">';
 h+='<a class="tile" href="#tasks"><span class="tlab">Tasks</span><span class="tv">'+left+'<small>left</small></span><span class="ts">'+(due.length?(due.length-left)+' of '+due.length+' done today':'Nothing due today')+'</span></a>';
 h+='<a class="tile" href="#journal"><span class="tlab">Journal</span><span class="tv">'+(jt?"Done":"Write")+'</span><span class="ts">'+(jt?'Streak '+streakFn(hasJ)+' days':'Reminder '+S.settings.journalTime)+'</span></a>';
 h+='<a class="tile" href="#workout"><span class="tlab">Workout</span><span class="tv">'+parts.length+'<small>/'+allEx().length+'</small></span><span class="ts">'+(parts.length?esc(parts.join(" · ")):'Nothing logged yet')+'</span></a>';
 h+='<a class="tile" href="#progress"><span class="tlab">Focus</span><span class="tv">'+(S.pomo[tk]||0)+'<small>sessions</small></span><span class="ts">Workout streak '+streakFn(hasW)+' days</span></a>';
 h+='</div>';
 h+='<h2>Due today <span>'+left+' left</span></h2>';
 if(!due.length)h+='<div class="row"><span class="mute">Nothing due today.</span></div>';
 due.slice(0,4).forEach(function(t){h+=taskRow(t)});
 var up=[],na=nextAlarm();
 if(na!==null)up.push('Alarm '+leftText(na));
 S.events.filter(function(e){return e.d>=tk&&e.d<=key(addDays(new Date(),7))}).sort(function(a,b){return a.d.localeCompare(b.d)}).slice(0,3).forEach(function(e){up.push(esc(e.t)+' · '+new Date(e.d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}))});
 if(up.length){h+='<h2>Coming up</h2>';up.forEach(function(x){h+='<div class="row"><span>'+x+'</span></div>'})}
 if(!NATIVE)h+='<p class="note">Prototype with sample data.</p>';
 return h;
}

function vPrayers(){
 var tk=key(),tm=times(new Date()),pr=S.prayers[tk]||{},sn=S.sunnah[tk]||{},i,p;
 var h=head("Prayers",dateLong());
 h+='<section class="panel"><p class="eyebrow">Prayer streak · all five prayed</p><p class="ph-name">'+streak()+'<small>day'+(streak()===1?'':'s')+'</small></p>';
 h+='<div class="grid" role="img" aria-label="Last seven days of prayers"><span></span>';
 for(i=6;i>=0;i--){var d=addDays(new Date(),-i);h+='<span class="h'+(i===0?" t":"")+'">'+DOW[d.getDay()]+'</span>'}
 P.forEach(function(p){
  h+='<span class="n">'+PN[p]+'</span>';
  for(i=6;i>=0;i--){var k=key(addDays(new Date(),-i));h+='<span class="c"><span class="dot'+((S.prayers[k]||{})[p]?" on":"")+'"></span></span>'}
 });
 h+='</div></section>';
 h+='<h2>Today <span>Sunrise '+fmtT(tm.sunrise)+'</span></h2>';
 h+='<div class="ptab hd"><span></span><span style="text-align:center">Before</span><span style="text-align:center">Fard</span><span style="text-align:center">After</span></div>';
 P.forEach(function(p){

 fr.onload=function(){
  var im=new Image();
  im.onerror=function(){cb(null)};
  im.onload=function(){
   var sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   cb(c.toDataURL("image/jpeg",0.7));
  };
  im.src=fr.result;
 };

}

function say(m){["fst","nm"].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=m})}
function fileSafe(x){return String(x).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"note"}

function buildPdf(pages){

 function put(x){var u=typeof x==="string"?enc.encode(x):x;chunks.push(u);len+=u.length}
 function obj(num,body){offs[num]=len;put(num+" 0 obj\n"+body+"\nendobj\n")}
 put("%PDF-1.4\n");
 var kids=[];for(i=0;i<n;i++)kids.push((3+i*3)+" 0 R");
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
 pages.forEach(function(p,j){
  var pn=3+j*3,cn=pn+1,im=pn+2,land=p.w>=p.h,PW=land?842:595,PH=land?595:842,sc=Math.min(PW/p.w,PH/p.h),dw=p.w*sc,dh=p.h*sc,x=(PW-dw)/2,y=(PH-dh)/2;
  obj(pn,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Contents "+cn+" 0 R /Resources << /XObject << /Im0 "+im+" 0 R >> >> >>");
  var cs="q "+dw.toFixed(2)+" 0 0 "+dh.toFixed(2)+" "+x.toFixed(2)+" "+y.toFixed(2)+" cm /Im0 Do Q";
  obj(cn,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  offs[im]=len;
  put(im+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+p.w+" /Height "+p.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+p.bytes.length+" >>\nstream\n");
  put(p.bytes);put("\nendstream\nendobj\n");
 });

 put("xref\n0 "+total+"\n0000000000 65535 f \n");
 for(i=1;i<total;i++)put(String(offs[i]).padStart(10,"0")+" 00000 n \n");

async function exportPdf(photos,name){

  say("Preparing PDF...");
  var pages=[],i,im;
  for(i=0;i<photos.length;i++){
   var pu=photos[i].url;
   im=await loadImg(pu);
   if(photos[i].ann&&photos[i].ann.length){
    var cvs=document.createElement("canvas");cvs.width=im.naturalWidth;cvs.height=im.naturalHeight;
    var cx2=cvs.getContext("2d");cx2.drawImage(im,0,0);drawAnn(cx2,cvs.width,cvs.height,photos[i].ann);
    pu=cvs.toDataURL("image/jpeg",0.85);
   }
   pages.push({bytes:b64bytes(pu),w:im.naturalWidth,h:im.naturalHeight});
  }
  var blob=new Blob([buildPdf(pages)],{type:"application/pdf"});
  if(NATIVE){say(await nativeSavePdf(name+".pdf",blob));return}
  var dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;
  if(!dl){say("Saving files is not available in this view.");return}
  await dl.save({filename:name+".pdf",data:blob});

  say(err&&err.code==="declined"?"PDF not saved.":"Could not save the PDF ("+((err&&(err.code||err.message))||"error")+").");

}

function atTime(base,min){var d=new Date(base);d.setHours(0,0,0,0);d.setMinutes(min);return d}
async function nativeInit(){
 var LN=cap().LocalNotifications;if(!LN)return;
 try{
  await LN.createChannel({id:"prayers",name:"Prayer times",importance:4,visibility:1,vibration:true});
  await LN.createChannel({id:"reminders",name:"Reminders",importance:4,visibility:1,vibration:true});
  await LN.createChannel({id:"alarms",name:"Alarms and timers",importance:5,visibility:1,vibration:true});
  var p=await LN.checkPermissions();
  if(p.display!=="granted")p=await LN.requestPermissions();
  nativeReady=p.display==="granted";
  if(nativeReady){
   try{
    var ex=await LN.checkExactNotificationSetting();
    if(ex.exact_alarm!=="granted"&&!S.settings.exactAsked){
     S.settings.exactAsked=true;save();
     toast("Allow alarms and reminders for Focus on the next screen so notifications arrive on time.");
     setTimeout(function(){LN.changeExactNotificationSetting().catch(function(){})},2500);
    }
   }catch(e){}
   await nativeSchedule();
  }else toast("Notifications are off. Allow them in Android settings so prayer times and alarms can reach you.");
 }catch(e){}
 document.addEventListener("visibilitychange",nativeVis);
 try{var App=cap().App;if(App&&App.addListener)App.addListener("resume",function(){nativeSchedule()})}catch(e){}
}
async function nativeSchedule(){
 var LN=cap().LocalNotifications;if(!LN||!nativeReady||schedBusy)return;
 schedBusy=true;
 try{
  var pend=await LN.getPending(),ids=pend.notifications.filter(function(n){return n.id<5000}).map(function(n){return {id:n.id}});
  if(ids.length)await LN.cancel({notifications:ids});
  var out=[],now=Date.now(),d,changed=false;
  var add=function(id,title,body,at,ch){if(at.getTime()>now+2000)out.push({id:id,title:title,body:body,schedule:{at:at,allowWhileIdle:true},channelId:ch})};
  for(d=0;d<7;d++){
   (function(d){
    var day=addDays(new Date(),d),tm=times(day);
    P.forEach(function(p,ix){add(1000+d*10+ix,PN[p],"It is time for "+PN[p]+" · "+fmtT(tm[p]),atTime(day,tm[p]),"prayers")});
    if(!(d===0&&(S.journal[key(day)]||"").trim()))add(1100+d,"Journal","Write today's entry.",atTime(day,hmToMin(S.settings.journalTime)),"reminders");
   })(d);
  }
  S.tasks.forEach(function(t,ix){
   if(t.done||!t.due||t.day!=="today")return;
   var at=atTime(new Date(),hmToMin(t.due));if(at.getTime()<=now+2000)at=atTime(addDays(new Date(),1),hmToMin(t.due));
   add(2000+(ix%900),"Task",t.t,at,"reminders");
  });
  S.alarms.forEach(function(a,ix){
   if(!a.on){if(a.fireAt){delete a.fireAt;changed=true}return}
   var m=hmToMin(a.time),dd,at;
   if(a.rep==="daily"){
    for(dd=0;dd<7;dd++){at=atTime(addDays(new Date(),dd),m);add(3000+ix*10+dd,a.label||"Alarm",fmtT(m),at,"alarms")}
   }else{
    if(!a.fireAt){at=atTime(new Date(),m);if(at.getTime()<=now+2000)at=atTime(addDays(new Date(),1),m);a.fireAt=at.getTime();changed=true}
    if(a.fireAt<=now){a.on=false;delete a.fireAt;changed=true}
    else add(3000+ix*10,a.label||"Alarm",fmtT(m),new Date(a.fireAt),"alarms");
   }
  });
  S.projects.forEach(function(p,ix){if(p.remind){var dt=new Date(p.remind);if(!isNaN(dt))add(4000+(ix%900),"Project",p.name,dt,"reminders")}});
  if(out.length)await LN.schedule({notifications:out});
  if(changed){var keep=window.nq;window.nq=function(){};save();window.nq=keep;if(route()==="tools")render()}
 }catch(e){}
 schedBusy=false;
}

}
async function nativeSavePdf(filename,blob){
 var FS=cap().Filesystem,SH=cap().Share;
 var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1])};fr.onerror=rej;fr.readAsDataURL(blob)});
 try{
  await FS.writeFile({path:"Focus/"+filename,directory:"DOCUMENTS",data:b64,recursive:true});
  return "PDF saved in Documents/Focus: "+filename;
 }catch(e1){
  try{
   var w=await FS.writeFile({path:filename,directory:"CACHE",data:b64});
   if(SH){await SH.share({title:filename,files:[w.uri],dialogTitle:"Save PDF"});return "PDF ready. Choose where to save it."}
  }catch(e2){}
  return "Could not save the PDF.";
 }
}
async function dictateNative(){

  var av=await SRp.available();
  if(!av.available){st.textContent="Voice input is not available on this phone. Use the mic on your keyboard.";return}
  var pm=await SRp.checkPermissions();
  if(pm.speechRecognition!=="granted")pm=await SRp.requestPermissions();
  if(pm.speechRecognition!=="granted"){st.textContent="Allow microphone access for Focus in Android settings to use voice input.";return}
  var base=ta.value+(ta.value&&!/\s$/.test(ta.value)?" ":""),lang=(document.getElementById("jlang")||{}).value||"en-IN";
  await SRp.removeAllListeners();
  SRp.addListener("partialResults",function(r){var t=document.getElementById("jt"),x=(r&&r.matches&&r.matches[0])||"";if(t)t.value=base+x});
  SRp.addListener("listeningState",function(r){if(r&&r.status==="stopped"){recN=false;var b=document.querySelector('[data-a="jdict"]');if(b)b.textContent="Dictate";var s2=document.getElementById("jst");if(s2)s2.textContent="Tap Dictate to add more, then Save."}});
  recN=true;if(btn)btn.textContent="Stop";st.textContent="Listening. Speak, then tap Save.";
  await SRp.start({language:lang,maxResults:1,partialResults:true,popup:false});
 }catch(e){recN=false;if(btn)btn.textContent="Dictate";if(st)st.textContent="Voice input stopped.";}
}
