name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: yes | sdkmanager --licenses > /dev/null || true

      - name: Write project files
        run: |
          cat > package.json <<'EOF'
          {
            "name": "focus-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.6.0",
              "@capacitor/app": "8.1.2",
              "@capacitor/core": "8.6.0",
              "@capacitor/filesystem": "8.1.5",
              "@capacitor/local-notifications": "8.3.1",
              "@capacitor/share": "8.0.3",
              "@capacitor-community/speech-recognition": "7.0.1",
              "@fontsource-variable/archivo": "5.3.0",
              "@fontsource-variable/hanken-grotesk": "5.3.0",
              "@fontsource-variable/jetbrains-mono": "5.3.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.6.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.zaik.focus",
            "appName": "Focus",
            "webDir": "www",
            "backgroundColor": "#fbfbfa",
            "android": { "allowMixedContent": false },
            "plugins": {
              "LocalNotifications": { "smallIcon": "ic_stat_focus", "iconColor": "#0C0C0C" }
            }
          }
          EOF
          cat > setup_android.py <<'EOF'
          import os, re
          from PIL import Image, ImageDraw
          main = "android/app/src/main"
          res = main + "/res"

          # ---- manifest ----
          mp = main + "/AndroidManifest.xml"
          m = open(mp).read()
          perms = [
           '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
           '<uses-permission android:name="android.permission.VIBRATE" />',
           '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
           '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />',
           '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
           '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
           '<uses-permission android:name="android.permission.CAMERA" />',
           '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
           '<uses-feature android:name="android.hardware.camera" android:required="false" />',
           '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          add = [p for p in perms if re.search(r'android:name="([^"]+)"', p).group(1) not in m]
          if add:
              m = m.replace("</manifest>", "    " + "\n    ".join(add) + "\n</manifest>")
          if "screenOrientation" not in m:
              m = m.replace('android:launchMode="singleTask"', 'android:launchMode="singleTask"\n            android:screenOrientation="portrait"')
          if "RecognitionService" not in m:
              m = m.replace("</manifest>", '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>')
          open(mp, "w").write(m)

          # ---- splash colour ----
          sp = res + "/values/styles.xml"
          st = open(sp).read()
          if "windowSplashScreenBackground" not in st:
              st = st.replace('<item name="android:background">@drawable/splash</item>', '<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">#0C0C0C</item>')
          open(sp, "w").write(st)

          # ---- icons ----
          INK = (12, 12, 12, 255); W = (251, 251, 250, 255)
          def ring(sz, scale, round_mask=False, transparent=False, radius=0.22):
              S = sz * 4
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0) if transparent else INK)
              d = ImageDraw.Draw(im); c = S / 2; R = S * scale
              d.ellipse([c - R, c - R, c + R, c + R], outline=W, width=int(S * 0.075))
              r2 = S * 0.075
              d.ellipse([c - r2, c - r2, c + r2, c + r2], fill=W)
              if not transparent:
                  mk = Image.new("L", (S, S), 0); md = ImageDraw.Draw(mk)
                  if round_mask: md.ellipse([0, 0, S - 1, S - 1], fill=255)
                  else: md.rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * radius), fill=255)
                  out = Image.new("RGBA", (S, S), (0, 0, 0, 0)); out.paste(im, (0, 0), mk); im = out
              return im.resize((sz, sz), Image.LANCZOS)
          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for k, (l, f) in dens.items():
              d = "%s/mipmap-%s" % (res, k); os.makedirs(d, exist_ok=True)
              ring(l, 0.30).save(d + "/ic_launcher.png")
              ring(l, 0.30, round_mask=True).save(d + "/ic_launcher_round.png")
              ring(f, 0.21, transparent=True).save(d + "/ic_launcher_foreground.png")
          for root, _, files in os.walk(res):
              for fn in files:
                  if fn == "splash.png":
                      p = os.path.join(root, fn); w, h = Image.open(p).size
                      Image.new("RGB", (w, h), (12, 12, 12)).save(p)
          open(res + "/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0C0C0C</color>\n</resources>\n')
          os.makedirs(res + "/drawable", exist_ok=True)
          open(res + "/drawable/ic_stat_focus.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FFFFFF" android:fillType="evenOdd" android:pathData="M12,2.5A9.5,9.5 0 1,0 12,21.5A9.5,9.5 0 1,0 12,2.5ZM12,5A7,7 0 1,1 12,19A7,7 0 1,1 12,5Z" />\n    <path android:fillColor="#FFFFFF" android:pathData="M12,10.2A1.8,1.8 0 1,0 12,13.8A1.8,1.8 0 1,0 12,10.2Z" />\n</vector>\n')
          print("Android project patched.")
          EOF

      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Prepare the web app
        run: |
          mkdir -p www/fonts
          cp index.html www/index.html
          cp node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2 www/fonts/
          cp node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2 www/fonts/
          cp node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2 www/fonts/

      - name: Create the Android project
        run: |
          npx cap add android
          python3 setup_android.py
          npx cap sync android

      - name: Use the fixed signing key so updates install over older builds
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: Focus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Focus.apk
          gh release create "build-${{ github.run_number }}" Focus.apk --title "Focus build ${{ github.run_number }}" --notes "Install Focus.apk on your Android phone. Updating keeps your data." --latest
